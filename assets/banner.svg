<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="CriZpy-Bot Hero Banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#131926"/>
      <stop offset="100%" stop-color="#1b1f38"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5865F2"/>
      <stop offset="50%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#FEE75C"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5865F2"/>
      <stop offset="100%" stop-color="#EB459E"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>

  <!-- Glow circles -->
  <circle cx="1060" cy="70" r="140" fill="#5865F2" fill-opacity="0.14"/>
  <circle cx="160" cy="280" r="120" fill="#00D4FF" fill-opacity="0.08"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="5" rx="2" fill="url(#accent)"/>

  <!-- Emblem -->
  <rect x="64" y="68" width="112" height="112" rx="28" fill="url(#iconGrad)"/>
  <rect x="64" y="68" width="112" height="112" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
  <text x="120" y="138" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="800" fill="#FFFFFF">CZ</text>

  <!-- Title & Tagline -->
  <text x="204" y="114" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="800" fill="#F0F6FC" letter-spacing="-0.5">CriZpy-Bot</text>
  <text x="206" y="152" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="500" fill="#9FB3C8">Bot multipropósito de Discord en producción — Node.js, discord.js v14, MongoDB &amp; Canvas</text>
  <text x="206" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#7D8590">Moderación AutoMod • Tickets HTML • Economía Atómica • Duelos PvP • Voz &amp; Niveles • Generación Canvas 2D</text>

  <!-- Stat Pills -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">
    <rect x="64" y="222" width="175" height="40" rx="10" fill="#161B22" stroke="#5865F2" stroke-opacity="0.7" stroke-width="1.5"/>
    <text x="151" y="247" text-anchor="middle" fill="#D2A8FF">85+ Slash Commands</text>

    <rect x="255" y="222" width="155" height="40" rx="10" fill="#161B22" stroke="#2EA043" stroke-opacity="0.7" stroke-width="1.5"/>
    <text x="332" y="247" text-anchor="middle" fill="#7EE787">27 Event Listeners</text>

    <rect x="426" y="222" width="175" height="40" rx="10" fill="#161B22" stroke="#00D4FF" stroke-opacity="0.65" stroke-width="1.5"/>
    <text x="513" y="247" text-anchor="middle" fill="#79C0FF">39 Modelos MongoDB</text>

    <rect x="617" y="222" width="185" height="40" rx="10" fill="#161B22" stroke="#F78166" stroke-opacity="0.7" stroke-width="1.5"/>
    <text x="709" y="247" text-anchor="middle" fill="#FFA657">@napi-rs/canvas 2D</text>

    <rect x="818" y="222" width="168" height="40" rx="10" fill="#161B22" stroke="#FEE75C" stroke-opacity="0.7" stroke-width="1.5"/>
    <text x="902" y="247" text-anchor="middle" fill="#FEE75C">24/7 Oracle VPS</text>

    <rect x="1002" y="222" width="134" height="40" rx="10" fill="#161B22" stroke="#8B949E" stroke-opacity="0.6" stroke-width="1.5"/>
    <text x="1069" y="247" text-anchor="middle" fill="#C9D1D9">Top.gg Ready</text>
  </g>
</svg>
